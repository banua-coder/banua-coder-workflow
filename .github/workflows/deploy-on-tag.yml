name: Deploy on Tag

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        default: 'production'
      deploy-provider:
        description: 'Deployment provider (ssh, vercel, netlify, firebase, custom)'
        type: string
        default: 'ssh'
      build-command:
        description: 'Build command'
        type: string
        default: ''
      deploy-path:
        description: 'Remote deployment path (for SSH)'
        type: string
        default: ''
      node-version:
        description: 'Node.js version'
        type: string
        default: '20'
      php-version:
        description: 'PHP version'
        type: string
        default: '8.2'
      backup-enabled:
        description: 'Enable backup before deployment for rollback support'
        type: boolean
        default: true
      backup-keep:
        description: 'Number of backups to keep (0 = keep all)'
        type: number
        default: 3
    secrets:
      SSH_HOST:
        description: 'SSH host'
        required: false
      SSH_USER:
        description: 'SSH username'
        required: false
      SSH_KEY:
        description: 'SSH private key'
        required: false
      SSH_PORT:
        description: 'SSH port'
        required: false
      VERCEL_TOKEN:
        description: 'Vercel token'
        required: false
      VERCEL_ORG_ID:
        description: 'Vercel org ID'
        required: false
      VERCEL_PROJECT_ID:
        description: 'Vercel project ID'
        required: false
      NETLIFY_AUTH_TOKEN:
        description: 'Netlify auth token'
        required: false
      NETLIFY_SITE_ID:
        description: 'Netlify site ID'
        required: false
      FIREBASE_TOKEN:
        description: 'Firebase token'
        required: false
    outputs:
      deploy-url:
        description: 'Deployment URL'
        value: ${{ jobs.deploy.outputs.deploy-url }}
      status:
        description: 'Deployment status'
        value: ${{ jobs.deploy.outputs.status }}
      backup-path:
        description: 'Path to the backup created before deployment'
        value: ${{ jobs.backup.outputs.backup-path }}

jobs:
  # ──────────────────────────────────────────────────────────────────
  # BACKUP — snapshot current state before deploying (SSH only)
  # Skipped for cloud providers (Vercel/Netlify/Firebase handle their own versioning)
  # ──────────────────────────────────────────────────────────────────
  backup:
    name: Backup
    runs-on: ubuntu-latest
    if: inputs.backup-enabled && inputs.deploy-provider == 'ssh'
    outputs:
      backup-path: ${{ steps.backup.outputs.backup-path }}
    steps:
      - name: Create remote backup
        id: backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            DEPLOY_PATH="${{ inputs.deploy-path }}"
            BACKUPS_DIR="$(dirname "$DEPLOY_PATH")/.backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_PATH="$BACKUPS_DIR/${TIMESTAMP}_$(basename "$DEPLOY_PATH")"

            mkdir -p "$BACKUPS_DIR"

            if [ -d "$DEPLOY_PATH" ]; then
              cp -a "$DEPLOY_PATH" "$BACKUP_PATH"
              echo "✅ Backup created: $BACKUP_PATH"
              echo "backup-path=$BACKUP_PATH" >> $GITHUB_OUTPUT
            else
              echo "⚠️ Deploy path does not exist yet — skipping backup"
              echo "backup-path=" >> $GITHUB_OUTPUT
            fi

            # Prune old backups
            KEEP=${{ inputs.backup-keep }}
            if [ "$KEEP" -gt 0 ]; then
              BACKUP_COUNT=$(ls -d "$BACKUPS_DIR"/*_"$(basename "$DEPLOY_PATH")" 2>/dev/null | wc -l)
              if [ "$BACKUP_COUNT" -gt "$KEEP" ]; then
                ls -dt "$BACKUPS_DIR"/*_"$(basename "$DEPLOY_PATH")" | tail -n +"$((KEEP + 1))" | xargs rm -rf
                echo "🧹 Pruned old backups (kept $KEEP)"
              fi
            fi

  # ──────────────────────────────────────────────────────────────────
  # DEPLOY — main deployment job
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: backup
    if: always() && (needs.backup.result == 'success' || needs.backup.result == 'skipped')
    environment: ${{ inputs.environment }}
    outputs:
      deploy-url: ${{ steps.set-outputs.outputs.url }}
      status: ${{ steps.set-outputs.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup environment
        uses: banua-coder/banua-coder-workflow/actions/setup-environment@main
        with:
          node-version: ${{ inputs.node-version }}
          php-version: ${{ inputs.php-version }}

      - name: Build (custom command)
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Build (auto-detect)
        if: inputs.build-command == ''
        run: |
          if [ -f "package.json" ]; then
            if [ -f "pnpm-lock.yaml" ]; then
              pnpm run build || npm run build
            elif [ -f "yarn.lock" ]; then
              yarn build || npm run build
            else
              npm run build
            fi
          fi

      # SSH Deployment
      - name: Deploy via SSH
        if: inputs.deploy-provider == 'ssh'
        id: ssh-deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ inputs.deploy-path }}
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Install dependencies
            if [ -f "composer.json" ]; then
              composer install --no-dev --optimize-autoloader
            fi
            if [ -f "package.json" ]; then
              if [ -f "pnpm-lock.yaml" ]; then
                pnpm install --frozen-lockfile
                pnpm run build
              elif [ -f "yarn.lock" ]; then
                yarn install --frozen-lockfile
                yarn build
              else
                npm ci
                npm run build
              fi
            fi

            # Laravel specific
            if [ -f "artisan" ]; then
              php artisan migrate --force
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan optimize
            fi

      # Vercel Deployment
      - name: Deploy to Vercel
        if: inputs.deploy-provider == 'vercel'
        id: vercel-deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      # Netlify Deployment
      - name: Deploy to Netlify
        if: inputs.deploy-provider == 'netlify'
        id: netlify-deploy
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: './dist'
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Firebase Deployment
      - name: Deploy to Firebase
        if: inputs.deploy-provider == 'firebase'
        id: firebase-deploy
        uses: w9jds/firebase-action@v13.5.2
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Set outputs
        id: set-outputs
        run: |
          PROVIDER="${{ inputs.deploy-provider }}"

          case "$PROVIDER" in
            vercel)
              echo "url=${{ steps.vercel-deploy.outputs.preview-url }}" >> $GITHUB_OUTPUT
              ;;
            netlify)
              echo "url=${{ steps.netlify-deploy.outputs.deploy-url }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "url=" >> $GITHUB_OUTPUT
              ;;
          esac

          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Deployment completed"

  # ──────────────────────────────────────────────────────────────────
  # ROLLBACK — restore backup when deploy job fails (SSH only)
  # ──────────────────────────────────────────────────────────────────
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: [backup, deploy]
    if: |
      always() &&
      needs.deploy.result == 'failure' &&
      needs.backup.result == 'success' &&
      needs.backup.outputs.backup-path != ''
    steps:
      - name: Restore backup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            DEPLOY_PATH="${{ inputs.deploy-path }}"
            BACKUP_PATH="${{ needs.backup.outputs.backup-path }}"

            echo "⚠️ Deployment failed — rolling back to: $BACKUP_PATH"

            if [ -d "$BACKUP_PATH" ]; then
              # Swap: remove current (broken) and restore backup
              rm -rf "$DEPLOY_PATH"
              cp -a "$BACKUP_PATH" "$DEPLOY_PATH"
              echo "✅ Rollback successful: restored from $BACKUP_PATH"

              # Re-run Laravel optimizations if applicable
              if [ -f "$DEPLOY_PATH/artisan" ]; then
                cd "$DEPLOY_PATH"
                php artisan config:cache
                php artisan route:cache
                php artisan view:cache
                php artisan optimize
                echo "✅ Laravel caches rebuilt"
              fi
            else
              echo "❌ Backup not found at $BACKUP_PATH — cannot rollback!"
              exit 1
            fi

      - name: Annotate rollback
        run: |
          echo "## ⚠️ Deployment Failed — Rolled Back" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment of \`${{ github.ref_name }}\` failed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backup restored** | \`${{ needs.backup.outputs.backup-path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Production has been restored to the previous working state." >> $GITHUB_STEP_SUMMARY
          exit 1
