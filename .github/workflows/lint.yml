name: Lint

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version'
        type: string
        default: '8.3'
      node-version:
        description: 'Node.js version'
        type: string
        default: '20'
      pnpm-version:
        description: 'pnpm version (empty = use packageManager from package.json)'
        type: string
        default: ''
      lint-php:
        description: 'Run PHP linting (Laravel Pint)'
        type: boolean
        default: true
      lint-frontend:
        description: 'Run frontend linting (ESLint, Prettier)'
        type: boolean
        default: true
      php-paths:
        description: 'Paths to lint for PHP (space-separated)'
        type: string
        default: 'app config database routes'
      frontend-extensions:
        description: 'Frontend file extensions to lint (comma-separated)'
        type: string
        default: 'ts,vue,js,css'

      # Change scope (see README "Affected-only scope"). All off by default.
      affected-only:
        description: 'Run only what the change can break: skip every job when no changed file matches affected-paths, and pass the diff base to the tests (CI_AFFECTED_BASE). Full runs on PRs into main, release/* and hotfix/* PRs, and manual or scheduled runs.'
        type: boolean
        default: false
      affected-paths:
        description: 'Regex (grep -E) of repo-root paths that make the jobs run in affected-only mode. Empty means any file.'
        type: string
        default: ''
      base-ref:
        description: 'Diff base for affected-only and skip-version-only (a ref or SHA). Default: the merge base with the PR target, or the push before commit.'
        type: string
        default: ''
      skip-version-only:
        description: 'Skip every job when the change only bumps version lines (package.json, composer.json, pubspec.yaml, Cargo.toml and their lockfiles) and edits CHANGELOG.md, or changes nothing (a back-merge of a tested release).'
        type: boolean
        default: false
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      # Full history without file contents: enough for merge-base and diffs.
      - name: Checkout
        if: inputs.affected-only || inputs.skip-version-only
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide what runs
        id: scope
        shell: bash
        env:
          AFFECTED_ONLY: ${{ inputs.affected-only }}
          AFFECTED_PATHS: ${{ inputs.affected-paths }}
          SKIP_VERSION_ONLY: ${{ inputs.skip-version-only }}
          BASE_REF: ${{ inputs.base-ref }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out() { echo "$1" >>"$GITHUB_OUTPUT"; echo "scope: $1"; }
          if [[ $AFFECTED_ONLY != true && $SKIP_VERSION_ONLY != true ]]; then
            out run=true; out full=true; out base=; exit 0
          fi
          full=false
          if [[ $EVENT == workflow_dispatch || $EVENT == schedule || $PR_BASE == main || $PR_HEAD == release/* || $PR_HEAD == hotfix/* ]]; then
            full=true
          fi
          base=''
          if [[ -n $BASE_REF ]]; then
            base=$(git merge-base "$BASE_REF" HEAD)
          elif [[ $EVENT == pull_request* ]]; then
            base=$(git merge-base "origin/$PR_BASE" HEAD)
          elif [[ -n $PUSH_BEFORE && ! $PUSH_BEFORE =~ ^0+$ ]] && git merge-base --is-ancestor "$PUSH_BEFORE" HEAD 2>/dev/null; then
            base=$PUSH_BEFORE
          fi
          if [[ -z $base ]]; then full=true; base=$(git rev-parse HEAD); fi
          files=$(git diff --name-only "$base" HEAD)
          run=true
          if [[ $SKIP_VERSION_ONLY == true ]]; then
            version_only=true
            if [[ -n $files ]]; then
              if grep -vqE '(^|/)(package(-lock)?\.json|composer\.json|pubspec\.yaml|Cargo\.(toml|lock)|CHANGELOG\.md)$' <<<"$files"; then
                version_only=false
              else
                lines=$(git diff -U0 "$base" HEAD -- . ':(exclude,glob)**/CHANGELOG.md' | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)
                if [[ -n $lines ]] && grep -vqE '^[+-][[:space:]]*("version": *"[^"]*",?|version: *[^ ]+|version *= *"[^"]*")$' <<<"$lines"; then
                  version_only=false
                fi
              fi
            fi
            [[ $version_only == true ]] && run=false
          fi
          if [[ $AFFECTED_ONLY == true && $full != true ]]; then
            if [[ -z $files ]] || ! grep -qE "${AFFECTED_PATHS:-.}" <<<"$files"; then run=false; fi
          fi
          out "run=$run"; out "full=$full"; out "base=$base"

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.run == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.php
            **/*.ts
            **/*.vue
            **/*.js
            **/*.css

      - name: Setup PHP
        if: inputs.lint-php && steps.changed-files.outputs.any_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}

      - name: Setup Node.js
        if: inputs.lint-frontend && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm (with version)
        if: inputs.lint-frontend && steps.changed-files.outputs.any_changed == 'true' && inputs.pnpm-version != ''
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup pnpm (from packageManager)
        if: inputs.lint-frontend && steps.changed-files.outputs.any_changed == 'true' && inputs.pnpm-version == ''
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        if: inputs.lint-frontend && steps.changed-files.outputs.any_changed == 'true'
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: inputs.lint-frontend && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [ -f "composer.json" ]; then
            composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          fi
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          fi

      - name: Get changed PHP files
        if: inputs.lint-php
        id: changed-php
        uses: tj-actions/changed-files@v45
        with:
          files: '**/*.php'

      - name: Run Pint on changed files
        if: inputs.lint-php && steps.changed-php.outputs.any_changed == 'true'
        run: |
          echo "Linting PHP files: ${{ steps.changed-php.outputs.all_changed_files }}"
          vendor/bin/pint ${{ steps.changed-php.outputs.all_changed_files }}

      - name: Get changed frontend files
        if: inputs.lint-frontend
        id: changed-frontend
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.ts
            **/*.vue
            **/*.js
            **/*.css

      - name: Format with Prettier
        if: inputs.lint-frontend && steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -f "node_modules/.bin/prettier" ]; then
            echo "Formatting files: ${{ steps.changed-frontend.outputs.all_changed_files }}"
            npx prettier --write ${{ steps.changed-frontend.outputs.all_changed_files }}
          fi

      - name: Lint with ESLint
        if: inputs.lint-frontend && steps.changed-frontend.outputs.any_changed == 'true'
        run: |
          if [ -f "node_modules/.bin/eslint" ]; then
            echo "Linting files: ${{ steps.changed-frontend.outputs.all_changed_files }}"
            npx eslint ${{ steps.changed-frontend.outputs.all_changed_files }} --fix || true
          fi

      - name: No files to lint
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No relevant files changed, skipping linting"
