name: Laravel Tests

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version'
        type: string
        default: '8.3'
      node-version:
        description: 'Node.js version'
        type: string
        default: '20'
      pnpm-version:
        description: 'pnpm version (empty = use packageManager from package.json)'
        type: string
        default: ''
      database:
        description: 'Database type (sqlite, mysql, pgsql)'
        type: string
        default: 'sqlite'
      run-migrations:
        description: 'Run database migrations'
        type: boolean
        default: true
      run-seeders:
        description: 'Run database seeders'
        type: boolean
        default: true
      build-assets:
        description: 'Build frontend assets'
        type: boolean
        default: true
      test-command:
        description: 'Test command to run'
        type: string
        default: './vendor/bin/pest'
      coverage:
        description: 'Enable code coverage (xdebug, pcov, none)'
        type: string
        default: 'none'
      extra-databases:
        description: 'Additional SQLite database files to create (space-separated, e.g., "flags.sqlite")'
        type: string
        default: ''

      # Change scope (see README "Affected-only scope"). All off by default.
      affected-only:
        description: 'Run only what the change can break: skip every job when no changed file matches affected-paths, and pass the diff base to the tests (CI_AFFECTED_BASE). Full runs on PRs into main, release/* and hotfix/* PRs, and manual or scheduled runs.'
        type: boolean
        default: false
      affected-paths:
        description: 'Regex (grep -E) of repo-root paths that make the jobs run in affected-only mode. Empty means any file.'
        type: string
        default: ''
      base-ref:
        description: 'Diff base for affected-only and skip-version-only (a ref or SHA). Default: the merge base with the PR target, or the push before commit.'
        type: string
        default: ''
      skip-version-only:
        description: 'Skip every job when the change only bumps version lines (package.json, composer.json, pubspec.yaml, Cargo.toml and their lockfiles) and edits CHANGELOG.md, or changes nothing (a back-merge of a tested release).'
        type: boolean
        default: false
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      # Full history without file contents: enough for merge-base and diffs.
      - name: Checkout
        if: inputs.affected-only || inputs.skip-version-only
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide what runs
        id: scope
        shell: bash
        env:
          AFFECTED_ONLY: ${{ inputs.affected-only }}
          AFFECTED_PATHS: ${{ inputs.affected-paths }}
          SKIP_VERSION_ONLY: ${{ inputs.skip-version-only }}
          BASE_REF: ${{ inputs.base-ref }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out() { echo "$1" >>"$GITHUB_OUTPUT"; echo "scope: $1"; }
          if [[ $AFFECTED_ONLY != true && $SKIP_VERSION_ONLY != true ]]; then
            out run=true; out full=true; out base=; exit 0
          fi
          full=false
          if [[ $EVENT == workflow_dispatch || $EVENT == schedule || $PR_BASE == main || $PR_HEAD == release/* || $PR_HEAD == hotfix/* ]]; then
            full=true
          fi
          base=''
          if [[ -n $BASE_REF ]]; then
            base=$(git merge-base "$BASE_REF" HEAD)
          elif [[ $EVENT == pull_request* ]]; then
            base=$(git merge-base "origin/$PR_BASE" HEAD)
          elif [[ -n $PUSH_BEFORE && ! $PUSH_BEFORE =~ ^0+$ ]] && git merge-base --is-ancestor "$PUSH_BEFORE" HEAD 2>/dev/null; then
            base=$PUSH_BEFORE
          fi
          if [[ -z $base ]]; then full=true; base=$(git rev-parse HEAD); fi
          files=$(git diff --name-only "$base" HEAD)
          run=true
          if [[ $SKIP_VERSION_ONLY == true ]]; then
            version_only=true
            if [[ -n $files ]]; then
              if grep -vqE '(^|/)(package(-lock)?\.json|composer\.json|pubspec\.yaml|Cargo\.(toml|lock)|CHANGELOG\.md)$' <<<"$files"; then
                version_only=false
              else
                lines=$(git diff -U0 "$base" HEAD -- . ':(exclude,glob)**/CHANGELOG.md' | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)
                if [[ -n $lines ]] && grep -vqE '^[+-][[:space:]]*("version": *"[^"]*",?|version: *[^ ]+|version *= *"[^"]*")$' <<<"$lines"; then
                  version_only=false
                fi
              fi
            fi
            [[ $version_only == true ]] && run=false
          fi
          if [[ $AFFECTED_ONLY == true && $full != true ]]; then
            if [[ -z $files ]] || ! grep -qE "${AFFECTED_PATHS:-.}" <<<"$files"; then run=false; fi
          fi
          out "run=$run"; out "full=$full"; out "base=$base"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.run == 'true'
    env:
      # The diff base in affected-only mode, empty on full runs.
      CI_AFFECTED_BASE: ${{ inputs.affected-only && needs.scope.outputs.full != 'true' && needs.scope.outputs.base || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # The affected-only diff base must be in the history.
        with:
          fetch-depth: ${{ inputs.affected-only && '0' || '1' }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          coverage: ${{ inputs.coverage }}
          extensions: mbstring, xml, ctype, json, bcmath, pdo_sqlite, pdo_mysql, pdo_pgsql

      - name: Setup Node.js
        if: inputs.build-assets
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm (with version)
        if: inputs.build-assets && inputs.pnpm-version != ''
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Setup pnpm (from packageManager)
        if: inputs.build-assets && inputs.pnpm-version == ''
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        if: inputs.build-assets
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: inputs.build-assets
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        if: inputs.build-assets
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          fi

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup SQLite database
        if: inputs.database == 'sqlite'
        run: |
          touch database/database.sqlite
          # Create additional SQLite databases if specified
          if [ -n "${{ inputs.extra-databases }}" ]; then
            for db in ${{ inputs.extra-databases }}; do
              touch "database/$db"
              echo "Created database/$db"
            done
          fi

      - name: Run migrations
        if: inputs.run-migrations
        run: php artisan migrate --force

      - name: Run seeders
        if: inputs.run-seeders
        run: php artisan db:seed --force

      - name: Build assets
        if: inputs.build-assets
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm run build
          elif [ -f "package-lock.json" ]; then
            npm run build
          elif [ -f "yarn.lock" ]; then
            yarn build
          fi

      - name: Start dev server
        run: php artisan serve --port=8000 &
        env:
          APP_URL: http://127.0.0.1:8000

      - name: Wait for server
        run: |
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null 2>&1; do sleep 1; done'

      - name: Run tests
        run: ${{ inputs.test-command }}
        env:
          APP_URL: http://127.0.0.1:8000
