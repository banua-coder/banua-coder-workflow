name: Rust CI

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: 'Rust toolchain (e.g., stable, nightly, 1.80.0)'
        type: string
        default: 'stable'
      working-directory:
        description: 'Working directory'
        type: string
        default: '.'
      # Feature toggles
      run-tests:
        description: 'Run unit/integration tests'
        type: boolean
        default: true
      run-lint:
        description: 'Run clippy'
        type: boolean
        default: true
      run-fmt-check:
        description: 'Run cargo fmt --check'
        type: boolean
        default: true
      run-build:
        description: 'Build the project in release mode'
        type: boolean
        default: true
      run-clippy:
        description: 'Run clippy (alias for run-lint, kept for explicitness)'
        type: boolean
        default: true
      # Configuration
      clippy-args:
        description: 'Extra arguments appended to cargo clippy'
        type: string
        default: '-- -D warnings'
      cargo-features:
        description: 'Feature flags passed to cargo (e.g., --features foo,bar)'
        type: string
        default: ''

      # Change scope (see README "Affected-only scope"). All off by default.
      affected-only:
        description: 'Run only what the change can break: skip every job when no changed file matches affected-paths, and pass the diff base to the tests (CI_AFFECTED_BASE). Full runs on PRs into main, release/* and hotfix/* PRs, and manual or scheduled runs.'
        type: boolean
        default: false
      affected-paths:
        description: 'Regex (grep -E) of repo-root paths that make the jobs run in affected-only mode. Empty means any file.'
        type: string
        default: ''
      base-ref:
        description: 'Diff base for affected-only and skip-version-only (a ref or SHA). Default: the merge base with the PR target, or the push before commit.'
        type: string
        default: ''
      skip-version-only:
        description: 'Skip every job when the change only bumps version lines (package.json, composer.json, pubspec.yaml, Cargo.toml and their lockfiles) and edits CHANGELOG.md, or changes nothing (a back-merge of a tested release).'
        type: boolean
        default: false
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      # Full history without file contents: enough for merge-base and diffs.
      - name: Checkout
        if: inputs.affected-only || inputs.skip-version-only
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide what runs
        id: scope
        shell: bash
        env:
          AFFECTED_ONLY: ${{ inputs.affected-only }}
          AFFECTED_PATHS: ${{ inputs.affected-paths }}
          SKIP_VERSION_ONLY: ${{ inputs.skip-version-only }}
          BASE_REF: ${{ inputs.base-ref }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out() { echo "$1" >>"$GITHUB_OUTPUT"; echo "scope: $1"; }
          if [[ $AFFECTED_ONLY != true && $SKIP_VERSION_ONLY != true ]]; then
            out run=true; out full=true; out base=; exit 0
          fi
          full=false
          if [[ $EVENT == workflow_dispatch || $EVENT == schedule || $PR_BASE == main || $PR_HEAD == release/* || $PR_HEAD == hotfix/* ]]; then
            full=true
          fi
          base=''
          if [[ -n $BASE_REF ]]; then
            base=$(git merge-base "$BASE_REF" HEAD)
          elif [[ $EVENT == pull_request* ]]; then
            base=$(git merge-base "origin/$PR_BASE" HEAD)
          elif [[ -n $PUSH_BEFORE && ! $PUSH_BEFORE =~ ^0+$ ]] && git merge-base --is-ancestor "$PUSH_BEFORE" HEAD 2>/dev/null; then
            base=$PUSH_BEFORE
          fi
          if [[ -z $base ]]; then full=true; base=$(git rev-parse HEAD); fi
          files=$(git diff --name-only "$base" HEAD)
          run=true
          if [[ $SKIP_VERSION_ONLY == true ]]; then
            version_only=true
            if [[ -n $files ]]; then
              if grep -vqE '(^|/)(package(-lock)?\.json|composer\.json|pubspec\.yaml|Cargo\.(toml|lock)|CHANGELOG\.md)$' <<<"$files"; then
                version_only=false
              else
                lines=$(git diff -U0 "$base" HEAD -- . ':(exclude,glob)**/CHANGELOG.md' | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)
                if [[ -n $lines ]] && grep -vqE '^[+-][[:space:]]*("version": *"[^"]*",?|version: *[^ ]+|version *= *"[^"]*")$' <<<"$lines"; then
                  version_only=false
                fi
              fi
            fi
            [[ $version_only == true ]] && run=false
          fi
          if [[ $AFFECTED_ONLY == true && $full != true ]]; then
            if [[ -z $files ]] || ! grep -qE "${AFFECTED_PATHS:-.}" <<<"$files"; then run=false; fi
          fi
          out "run=$run"; out "full=$full"; out "base=$base"

  detect:
    name: Detect Configuration
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.run == 'true'
    timeout-minutes: 15
    outputs:
      has-tests: ${{ steps.detect.outputs.has_tests }}
      has-cargo-toml: ${{ steps.detect.outputs.has_cargo_toml }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect project configuration
        id: detect
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Verify Cargo.toml exists
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo_toml=true" >> $GITHUB_OUTPUT
            echo "Cargo.toml found"
          else
            echo "has_cargo_toml=false" >> $GITHUB_OUTPUT
            echo "::warning::No Cargo.toml found in working directory"
          fi

          # Check for test functions
          if grep -rq '#\[test\]\|#\[tokio::test\]\|#\[async_std::test\]' --include='*.rs' . 2>/dev/null; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "Tests found"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "::warning::No test functions found"
          fi

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: inputs.run-fmt-check && needs.detect.outputs.has-cargo-toml == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workdir: ${{ inputs.working-directory }}

      - name: Run cargo fmt --check
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "## Format Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cargo fmt --all --check
          echo "✅ cargo fmt passed — no formatting issues" >> $GITHUB_STEP_SUMMARY

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect
    if: (inputs.run-lint || inputs.run-clippy) && needs.detect.outputs.has-cargo-toml == 'true'
    env:
      CARGO_FEATURES: ${{ inputs.cargo-features }}
      CLIPPY_ARGS: ${{ inputs.clippy-args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workdir: ${{ inputs.working-directory }}

      - name: Run clippy
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "## Clippy Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$CARGO_FEATURES" ]; then
            # shellcheck disable=SC2086
            cargo clippy --all-targets $CARGO_FEATURES $CLIPPY_ARGS
          else
            # shellcheck disable=SC2086
            cargo clippy --all-targets $CLIPPY_ARGS
          fi

          echo "✅ clippy passed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [scope, detect]
    if: inputs.run-tests && needs.detect.outputs.has-cargo-toml == 'true' && needs.detect.outputs.has-tests == 'true'
    env:
      CI_AFFECTED_BASE: ${{ inputs.affected-only && needs.scope.outputs.full != 'true' && needs.scope.outputs.base || '' }}
      CARGO_FEATURES: ${{ inputs.cargo-features }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # The affected-only diff base must be in the history.
        with:
          fetch-depth: ${{ inputs.affected-only && '0' || '1' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workdir: ${{ inputs.working-directory }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$CARGO_FEATURES" ]; then
            # shellcheck disable=SC2086
            cargo test --all $CARGO_FEATURES 2>&1 | tee /tmp/test_output.txt
          else
            cargo test --all 2>&1 | tee /tmp/test_output.txt
          fi

          # Parse results
          PASSED=$(grep -c '^test .* ok$' /tmp/test_output.txt || echo "0")
          FAILED=$(grep -c '^test .* FAILED$' /tmp/test_output.txt || echo "0")
          IGNORED=$(grep -c '^test .* ignored$' /tmp/test_output.txt || echo "0")

          echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Ignored | $IGNORED |" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [scope, detect, fmt, clippy, test]
    if: always() && needs.scope.outputs.run == 'true' && inputs.run-build && needs.detect.outputs.has-cargo-toml == 'true' && (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') && (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped')
    env:
      CARGO_FEATURES: ${{ inputs.cargo-features }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workdir: ${{ inputs.working-directory }}

      - name: Build release
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$CARGO_FEATURES" ]; then
            # shellcheck disable=SC2086
            cargo build --release $CARGO_FEATURES
          else
            cargo build --release
          fi

          # Report binary sizes
          if [ -d "target/release" ]; then
            BINS=$(find target/release -maxdepth 1 -type f -executable ! -name '*.d' ! -name '*.so' ! -name '*.dylib' 2>/dev/null | head -5)
            if [ -n "$BINS" ]; then
              echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
              while IFS= read -r bin; do
                SIZE=$(du -h "$bin" | cut -f1)
                NAME=$(basename "$bin")
                echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
              done <<< "$BINS"
            else
              echo "✅ Build successful (library crate)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
