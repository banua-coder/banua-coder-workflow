name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version (e.g., 1.22.x, stable)'
        type: string
        default: 'stable'
      working-directory:
        description: 'Working directory'
        type: string
        default: '.'
      # Feature toggles
      run-tests:
        description: 'Run unit tests'
        type: boolean
        default: true
      run-lint:
        description: 'Run golangci-lint'
        type: boolean
        default: true
      run-build:
        description: 'Build the project'
        type: boolean
        default: true
      run-coverage:
        description: 'Generate coverage report'
        type: boolean
        default: true
      # Configuration
      test-packages:
        description: 'Packages to test (default: ./...)'
        type: string
        default: './...'
      build-target:
        description: 'Build target (e.g., ./cmd/main.go)'
        type: string
        default: ''
      build-output:
        description: 'Build output name'
        type: string
        default: 'app'
      coverage-threshold:
        description: 'Minimum coverage percentage (0 to disable)'
        type: number
        default: 0
      golangci-lint-version:
        description: 'golangci-lint version'
        type: string
        default: 'v1.61.0'
      post-coverage-comment:
        description: 'Post coverage as PR comment'
        type: boolean
        default: true

      # Change scope (see README "Affected-only scope"). All off by default.
      affected-only:
        description: 'Run only what the change can break: skip every job when no changed file matches affected-paths, and pass the diff base to the tests (CI_AFFECTED_BASE). Full runs on PRs into main, release/* and hotfix/* PRs, and manual or scheduled runs.'
        type: boolean
        default: false
      affected-paths:
        description: 'Regex (grep -E) of repo-root paths that make the jobs run in affected-only mode. Empty means any file.'
        type: string
        default: ''
      base-ref:
        description: 'Diff base for affected-only and skip-version-only (a ref or SHA). Default: the merge base with the PR target, or the push before commit.'
        type: string
        default: ''
      skip-version-only:
        description: 'Skip every job when the change only bumps version lines (package.json, composer.json, pubspec.yaml, Cargo.toml and their lockfiles) and edits CHANGELOG.md, or changes nothing (a back-merge of a tested release).'
        type: boolean
        default: false
jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      # Full history without file contents: enough for merge-base and diffs.
      - name: Checkout
        if: inputs.affected-only || inputs.skip-version-only
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide what runs
        id: scope
        shell: bash
        env:
          AFFECTED_ONLY: ${{ inputs.affected-only }}
          AFFECTED_PATHS: ${{ inputs.affected-paths }}
          SKIP_VERSION_ONLY: ${{ inputs.skip-version-only }}
          BASE_REF: ${{ inputs.base-ref }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          out() { echo "$1" >>"$GITHUB_OUTPUT"; echo "scope: $1"; }
          if [[ $AFFECTED_ONLY != true && $SKIP_VERSION_ONLY != true ]]; then
            out run=true; out full=true; out base=; exit 0
          fi
          full=false
          if [[ $EVENT == workflow_dispatch || $EVENT == schedule || $PR_BASE == main || $PR_HEAD == release/* || $PR_HEAD == hotfix/* ]]; then
            full=true
          fi
          base=''
          if [[ -n $BASE_REF ]]; then
            base=$(git merge-base "$BASE_REF" HEAD)
          elif [[ $EVENT == pull_request* ]]; then
            base=$(git merge-base "origin/$PR_BASE" HEAD)
          elif [[ -n $PUSH_BEFORE && ! $PUSH_BEFORE =~ ^0+$ ]] && git merge-base --is-ancestor "$PUSH_BEFORE" HEAD 2>/dev/null; then
            base=$PUSH_BEFORE
          fi
          if [[ -z $base ]]; then full=true; base=$(git rev-parse HEAD); fi
          files=$(git diff --name-only "$base" HEAD)
          run=true
          if [[ $SKIP_VERSION_ONLY == true ]]; then
            version_only=true
            if [[ -n $files ]]; then
              if grep -vqE '(^|/)(package(-lock)?\.json|composer\.json|pubspec\.yaml|Cargo\.(toml|lock)|CHANGELOG\.md)$' <<<"$files"; then
                version_only=false
              else
                lines=$(git diff -U0 "$base" HEAD -- . ':(exclude,glob)**/CHANGELOG.md' | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' || true)
                if [[ -n $lines ]] && grep -vqE '^[+-][[:space:]]*("version": *"[^"]*",?|version: *[^ ]+|version *= *"[^"]*")$' <<<"$lines"; then
                  version_only=false
                fi
              fi
            fi
            [[ $version_only == true ]] && run=false
          fi
          if [[ $AFFECTED_ONLY == true && $full != true ]]; then
            if [[ -z $files ]] || ! grep -qE "${AFFECTED_PATHS:-.}" <<<"$files"; then run=false; fi
          fi
          out "run=$run"; out "full=$full"; out "base=$base"

  detect:
    name: Detect Configuration
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.run == 'true'
    outputs:
      has-tests: ${{ steps.detect.outputs.has_tests }}
      build-target: ${{ steps.detect.outputs.build_target }}
      go-changed: ${{ steps.changes.outputs.go_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect project configuration
        id: detect
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Check for tests
          if find . -name "*_test.go" -type f | head -1 | grep -q .; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
            echo "🧪 Tests found"
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
            echo "⚠️ No tests found"
          fi

          # Detect build target
          BUILD_TARGET="${{ inputs.build-target }}"
          if [ -z "$BUILD_TARGET" ]; then
            if [ -f "cmd/main.go" ]; then
              BUILD_TARGET="./cmd/main.go"
            elif [ -f "main.go" ]; then
              BUILD_TARGET="./main.go"
            elif [ -d "cmd" ]; then
              # Find first main.go in cmd subdirectories
              BUILD_TARGET=$(find cmd -name "main.go" -type f | head -1)
              if [ -n "$BUILD_TARGET" ]; then
                BUILD_TARGET="./$BUILD_TARGET"
              fi
            fi
          fi
          echo "build_target=$BUILD_TARGET" >> $GITHUB_OUTPUT
          echo "🎯 Build target: $BUILD_TARGET"

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi

          if git diff --name-only "$BASE_REF"..HEAD 2>/dev/null | grep -q '\.go$'; then
            echo "go_changed=true" >> $GITHUB_OUTPUT
            echo "🔍 Go files changed"
          else
            echo "go_changed=false" >> $GITHUB_OUTPUT
            echo "🔍 No Go file changes"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect
    if: inputs.run-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ inputs.golangci-lint-version }}
          working-directory: ${{ inputs.working-directory }}
          args: --timeout=5m

      - name: Lint summary
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ golangci-lint passed" >> $GITHUB_STEP_SUMMARY

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [scope, detect]
    if: inputs.run-tests && needs.detect.outputs.has-tests == 'true'
    env:
      # The diff base in affected-only mode, empty on full runs.
      CI_AFFECTED_BASE: ${{ inputs.affected-only && needs.scope.outputs.full != 'true' && needs.scope.outputs.base || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # The affected-only diff base must be in the history.
        with:
          fetch-depth: ${{ inputs.affected-only && '0' || '1' }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Verify dependencies
        working-directory: ${{ inputs.working-directory }}
        run: go mod verify

      - name: Download dependencies
        working-directory: ${{ inputs.working-directory }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PACKAGES="${{ inputs.test-packages }}"

          if [ "${{ inputs.run-coverage }}" = "true" ]; then
            go test -v -race -coverprofile=coverage.out -covermode=atomic $PACKAGES 2>&1 | tee test_output.txt
          else
            go test -v -race $PACKAGES 2>&1 | tee test_output.txt
          fi

          # Parse test results
          PASSED=$(grep -c "^--- PASS" test_output.txt || echo "0")
          FAILED=$(grep -c "^--- FAIL" test_output.txt || echo "0")

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

      - name: Generate coverage report
        if: inputs.run-coverage
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f "coverage.out" ]; then
            # Calculate coverage
            TOTAL_COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total Coverage: ${TOTAL_COVERAGE}%**" >> $GITHUB_STEP_SUMMARY

            # Check threshold
            THRESHOLD=${{ inputs.coverage-threshold }}
            if [ "$THRESHOLD" -gt 0 ]; then
              if [ "$(echo "$TOTAL_COVERAGE < $THRESHOLD" | bc)" -eq 1 ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "⚠️ Coverage is below threshold of ${THRESHOLD}%" >> $GITHUB_STEP_SUMMARY
              else
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "✅ Coverage meets threshold (${THRESHOLD}%)" >> $GITHUB_STEP_SUMMARY
              fi
            fi

            # Store for PR comment
            echo "TOTAL_COVERAGE=$TOTAL_COVERAGE" >> $GITHUB_ENV
          fi

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request' && inputs.run-coverage && inputs.post-coverage-comment
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = process.env.TOTAL_COVERAGE || 'N/A';
            const threshold = ${{ inputs.coverage-threshold }};

            let status = '✅';
            if (threshold > 0 && parseFloat(coverage) < threshold) {
              status = '⚠️';
            }

            const body = `## 📊 Go Coverage Report

            | Metric | Value |
            |--------|-------|
            | **Coverage** | **${coverage}%** ${status} |

            ${threshold > 0 ? `> Threshold: ${threshold}%` : ''}

            <details>
            <summary>Details</summary>

            Run \`go tool cover -func=coverage.out\` locally to see detailed coverage.
            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Go Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload coverage artifact
        if: inputs.run-coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: ${{ inputs.working-directory }}/coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [scope, detect, lint, test]
    if: always() && needs.scope.outputs.run == 'true' && inputs.run-build && needs.detect.outputs.build-target != '' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: |
          BUILD_TARGET="${{ needs.detect.outputs.build-target }}"
          OUTPUT="${{ inputs.build-output }}"

          echo "## 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BUILD_TARGET" ]; then
            echo "Building $BUILD_TARGET..."
            go build -v -ldflags="-w -s" -o "$OUTPUT" "$BUILD_TARGET"

            SIZE=$(du -h "$OUTPUT" | cut -f1)
            echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Binary | \`$OUTPUT\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Size | $SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Building all packages..."
            go build -v ./...
            echo "✅ All packages compiled successfully" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload binary artifact
        if: inputs.build-output != ''
        uses: actions/upload-artifact@v7
        with:
          name: go-binary
          path: ${{ inputs.working-directory }}/${{ inputs.build-output }}
          retention-days: 7
