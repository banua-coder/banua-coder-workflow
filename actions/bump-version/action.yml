name: 'Bump Version'
description: 'Bump version in project files (package.json, pubspec.yaml, composer.json, go.mod, etc.)'
author: 'Banua Coder'

inputs:
  version:
    description: 'The version to set (e.g., 1.2.3)'
    required: true
  bump-type:
    description: 'Type of version bump (major, minor, patch) - used if version not specified'
    required: false
    default: ''
  files:
    description: 'Comma-separated list of files to update (auto-detected if not specified)'
    required: false
    default: ''
  commit:
    description: 'Whether to commit the changes'
    required: false
    default: 'false'
  commit-message:
    description: 'Commit message template (use {version} placeholder)'
    required: false
    default: 'chore: bump version to {version}'

outputs:
  version:
    description: 'The new version'
    value: ${{ steps.bump.outputs.version }}
  previous-version:
    description: 'The previous version'
    value: ${{ steps.bump.outputs.previous_version }}
  files-updated:
    description: 'List of files that were updated'
    value: ${{ steps.bump.outputs.files_updated }}

runs:
  using: 'composite'
  steps:
    - name: Detect and bump version
      id: bump
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        VERSION="${VERSION#v}"  # Strip leading v prefix (package.json expects plain semver)
        FILES="${{ inputs.files }}"
        PREVIOUS_VERSION=""
        FILES_UPDATED=""

        # Auto-detect version files if not specified
        if [ -z "$FILES" ]; then
          FILES=""
          IS_PHP_PROJECT=false
          IS_GO_PROJECT=false

          # If .version-config.yml exists, delegate entirely to update-version.sh
          if [ -f ".version-config.yml" ]; then
            ACTION_SCRIPT="${{ github.action_path }}/../../scripts/release/update-version.sh"
            SCRIPT_PATH=""
            if [ -f "$ACTION_SCRIPT" ]; then
              SCRIPT_PATH="$ACTION_SCRIPT"
            elif [ -f "scripts/release/update-version.sh" ]; then
              SCRIPT_PATH="scripts/release/update-version.sh"
            elif [ -f "scripts/update-version.sh" ]; then
              SCRIPT_PATH="scripts/update-version.sh"
            fi
            if [ -n "$SCRIPT_PATH" ]; then
              echo "📋 .version-config.yml detected — using $SCRIPT_PATH"
              chmod +x "$SCRIPT_PATH"
              "$SCRIPT_PATH" "$VERSION" --config .version-config.yml
              FILES_UPDATED="(via .version-config.yml)"
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "previous_version=" >> $GITHUB_OUTPUT
              echo "files_updated=$FILES_UPDATED" >> $GITHUB_OUTPUT
              echo "✅ Version bumped to $VERSION"
              exit 0
            fi
          fi

          # Check if it's a Go project
          if [ -f "go.mod" ]; then
            IS_GO_PROJECT=true
            # Fallback: update common Go version patterns directly
            FILES="go:auto"
          fi

          # Check if it's a PHP/Laravel project
          if [ -f "config/app.php" ] || ([ -f "composer.json" ] && jq -e '.type == "project"' composer.json > /dev/null 2>&1); then
            IS_PHP_PROJECT=true
            [ -f "config/app.php" ] && FILES="$FILES,config/app.php"
          fi

          # Only add package.json if NOT a PHP or Go project
          if [ "$IS_PHP_PROJECT" = false ] && [ "$IS_GO_PROJECT" = false ] && [ -f "package.json" ]; then
            FILES="$FILES,package.json"
          fi

          [ -f "pubspec.yaml" ] && FILES="$FILES,pubspec.yaml"
          [ -f "version.txt" ] && FILES="$FILES,version.txt"
          [ -f "gradle.properties" ] && FILES="$FILES,gradle.properties"
          FILES="${FILES#,}"  # Remove leading comma
        fi

        echo "Detected files: $FILES"

        # Process each file
        IFS=',' read -ra FILE_ARRAY <<< "$FILES"
        for file in "${FILE_ARRAY[@]}"; do
          file=$(echo "$file" | xargs)  # Trim whitespace
          if [ ! -f "$file" ]; then
            echo "Warning: $file not found, skipping"
            continue
          fi

          echo "Processing $file..."

          case "$file" in
            go:auto)
              # Go project fallback — update common version patterns in Go files
              echo "🐹 Updating Go version files..."
              # cmd/main.go — Swagger @version annotation
              if [ -f "cmd/main.go" ]; then
                PREVIOUS_VERSION=$(grep -oP '@version\s+\K[0-9]+\.[0-9]+\.[0-9]+' cmd/main.go | head -1)
                perl -i -pe "s|(\@version\s+)[0-9]+\.[0-9]+\.[0-9]+|\${1}$VERSION|g" cmd/main.go
                echo "✅ Updated cmd/main.go"
                FILES_UPDATED="$FILES_UPDATED,cmd/main.go"
              fi
              # internal/handler — "version": "x.y.z" string literals
              for handler_file in $(grep -rl '"version":\s*"[0-9]\+\.[0-9]\+\.[0-9]\+"' internal/ 2>/dev/null); do
                if [[ "$handler_file" != *_test.go ]]; then
                  perl -i -pe 's|("version":\s*")[0-9]+\.[0-9]+\.[0-9]+|${1}'"$VERSION"'|g' "$handler_file"
                  echo "✅ Updated $handler_file"
                  FILES_UPDATED="$FILES_UPDATED,$handler_file"
                fi
              done
              # *_test.go — assert.Equal version strings
              for test_file in $(grep -rl 'assert\.Equal(t, "[0-9]\+\.[0-9]\+\.[0-9]\+"' internal/ 2>/dev/null); do
                perl -i -pe 's|(assert\.Equal\(t,\s*")[0-9]+\.[0-9]+\.[0-9]+|${1}'"$VERSION"'|g' "$test_file"
                echo "✅ Updated $test_file"
                FILES_UPDATED="$FILES_UPDATED,$test_file"
              done
              continue
              ;;
            config/app.php)
              # Laravel config/app.php - handles both direct values and env() patterns
              # Pattern 1: 'version' => env('APP_VERSION', 'x.x.x')
              # Pattern 2: 'version' => 'x.x.x'
              if grep -q "env('APP_VERSION'" "$file"; then
                # Extract previous version from env() default value
                PREVIOUS_VERSION=$(grep "'version'" "$file" | sed "s/.*env('APP_VERSION',[[:space:]]*'\([^']*\)').*/\1/")
                # Only replace the default value inside env()
                sed -i.bak "s/env('APP_VERSION',[[:space:]]*'[^']*')/env('APP_VERSION', '$VERSION')/" "$file"
              else
                # Direct value pattern
                PREVIOUS_VERSION=$(grep "'version'" "$file" | sed "s/.*'version'[[:space:]]*=>[[:space:]]*'\([^']*\)'.*/\1/")
                sed -i.bak "s/'version'[[:space:]]*=>[[:space:]]*'[^']*'/'version' => '$VERSION'/" "$file"
              fi
              rm -f "$file.bak"
              FILES_UPDATED="$FILES_UPDATED,$file"
              ;;
            package.json)
              PREVIOUS_VERSION=$(jq -r '.version // empty' "$file")
              jq --arg v "$VERSION" '.version = $v' "$file" > tmp.json && mv tmp.json "$file"
              FILES_UPDATED="$FILES_UPDATED,$file"
              ;;
            *pubspec.yaml)
              PREVIOUS_VERSION=$(grep '^version:' "$file" | sed 's/version: //' | cut -d'+' -f1)
              # Preserve build number if exists
              if grep -q '+' <<< "$(grep '^version:' "$file")"; then
                BUILD_NUM=$(grep '^version:' "$file" | sed 's/.*+//')
                sed -i.bak "s/^version: .*/version: $VERSION+$BUILD_NUM/" "$file"
              else
                sed -i.bak "s/^version: .*/version: $VERSION/" "$file"
              fi
              rm -f "$file.bak"
              FILES_UPDATED="$FILES_UPDATED,$file"
              ;;
            composer.json)
              PREVIOUS_VERSION=$(jq -r '.version // empty' "$file")
              if [ -n "$PREVIOUS_VERSION" ]; then
                jq --arg v "$VERSION" '.version = $v' "$file" > tmp.json && mv tmp.json "$file"
                FILES_UPDATED="$FILES_UPDATED,$file"
              fi
              ;;
            version.txt)
              PREVIOUS_VERSION=$(cat "$file" | tr -d '[:space:]')
              echo "$VERSION" > "$file"
              FILES_UPDATED="$FILES_UPDATED,$file"
              ;;
            gradle.properties)
              PREVIOUS_VERSION=$(grep '^VERSION_NAME=' "$file" | cut -d'=' -f2)
              sed -i.bak "s/^VERSION_NAME=.*/VERSION_NAME=$VERSION/" "$file"
              rm -f "$file.bak"
              FILES_UPDATED="$FILES_UPDATED,$file"
              ;;
            *.json)
              # Generic JSON with version field
              if jq -e '.version' "$file" > /dev/null 2>&1; then
                PREVIOUS_VERSION=$(jq -r '.version' "$file")
                jq --arg v "$VERSION" '.version = $v' "$file" > tmp.json && mv tmp.json "$file"
                FILES_UPDATED="$FILES_UPDATED,$file"
              fi
              ;;
          esac
        done

        FILES_UPDATED="${FILES_UPDATED#,}"  # Remove leading comma

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "previous_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
        echo "files_updated=$FILES_UPDATED" >> $GITHUB_OUTPUT

        echo "✅ Version bumped from $PREVIOUS_VERSION to $VERSION"
        echo "📁 Files updated: $FILES_UPDATED"

    - name: Commit changes
      if: inputs.commit == 'true'
      shell: bash
      run: |
        VERSION="${{ steps.bump.outputs.version }}"
        MESSAGE="${{ inputs.commit-message }}"
        MESSAGE="${MESSAGE//\{version\}/$VERSION}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "$MESSAGE" || echo "No changes to commit"
